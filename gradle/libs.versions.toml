[versions]
# AGP and tools should be updated together
androidGradlePlugin = "9.4.1"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.09.00"
androidxCore = "1.19.1"
androidxCoreSplashscreen = "1.2.0"
androidxDataStore = "1.2.1"
androidxHiltLifecycleViewModelCompose = "1.4.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.2"
androidxProfileinstaller = "1.4.1"
androidxTracing = "1.3.0"
ktlint = "1.4.0"
gmsPlugin = "4.5.0"
googleOssPlugin = "0.13.0"
hilt = "2.60.1"
junit4 = "4.13.2"
kotlin = "2.4.20"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
ksp = "2.3.12"
okHttp = "4.12.0"
protobuf = "4.29.2"
tinkAndroid = "1.16.0"
protobufPlugin = "0.10.0"
